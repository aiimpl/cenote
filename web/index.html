<style>
  html, body { margin: 0; height: 100%; background: #01060c; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body { color: #e6f1ff; font: 500 13px/1.4 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .ui { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 9px; pointer-events: none; }
  .seg { pointer-events: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(4,10,20,.42); border: 1px solid rgba(160,210,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .seg button { font: inherit; color: rgba(230,241,255,.72); background: none; border: 0; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
  .seg button.on { color: #04101e; background: rgba(214,236,255,.92); }
  #hint { color: rgba(230,241,255,.62); font-size: 12px; text-shadow: 0 1px 6px rgba(0,0,0,.6); transition: opacity .6s; }
  .src { position: absolute; right: 12px; top: max(10px, env(safe-area-inset-top)); color: rgba(230,241,255,.45); font-size: 11.5px; text-decoration: none; }
  body.film .ui, body.film .src { display: none; }
  body.film #c { cursor: none; }
</style>

</div>
